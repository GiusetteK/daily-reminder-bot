<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Promemoria personali</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">✓</div>
        <div><p class="eyebrow">IL TUO SPAZIO PERSONALE</p><h1>Promemoria</h1></div>
        <button id="open-dashboard" class="icon-button" type="button" title="Apri dashboard" aria-label="Apri dashboard">↗</button>
      </header>
      <section class="welcome-card">
        <div><p class="eyebrow">PANORAMICA DI OGGI</p><h2 id="today-heading">Ciao!</h2><p id="today-summary">Caricamento attività…</p></div>
        <div class="today-number"><strong id="today-count">0</strong><span>oggi</span></div>
      </section>
      <form id="quick-form" class="quick-form">
        <label for="task-title">Aggiungi un promemoria</label>
        <div class="quick-row"><input id="task-title" maxlength="120" placeholder="Cosa devi fare?" required><button type="submit" aria-label="Aggiungi">＋</button></div>
        <div class="quick-row secondary-row"><input id="task-due" type="datetime-local" required><select id="task-category" aria-label="Categoria"><option value="Personale">Personale</option><option value="Studio">Studio</option><option value="Lavoro">Lavoro</option><option value="Casa">Casa</option></select></div>
      </form>
      <section class="next-section"><div class="section-title"><h2>Prossimi</h2><button id="see-all" class="text-button" type="button">Vedi tutto <span>→</span></button></div><ul id="task-list" class="task-list"></ul><p id="empty-state" class="empty-state" hidden>Nessun promemoria in arrivo. Goditi il momento ✨</p></section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <footer>Privato per design · i dati restano in Chrome</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
